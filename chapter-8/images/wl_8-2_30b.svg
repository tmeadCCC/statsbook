<text xml:space="preserve" transform="matrix(1 0 -0 1 -221.34986 727.1998)" font-size="10" font-family="'Liberation Serif','Times New Roman',Tinos,Times,serif"><tspan y="-648.55" x="122.5 125.27 128.04 130.54 133.31 137.2 139.7 143.03 147.45999 152.45999 157.45999 160.79 163.56 167.98999 172.98999 175.48999 178.26 183.26 185.76 190.76 195.19 197.69 200.46 205.46 210.46 214.89002 219.89002 222.39002 224.89002 227.39002 234.05002 238.48001 246.25002 250.68003 258.45 263.45 267.88 271.21 273.71 276.47999 281.47999 285.90998 288.67997 291.17997 293.94996 298.94996 303.37995 305.87995 311.43995 314.75993 321.97993 326.4099 329.1799 334.1799 338.6099 341.1099 343.87989 347.7699 350.2699 353.0399 358.0399 362.46989 364.96989 369.96989 373.28987 378.28987 383.28987 387.71986 392.71986 395.48985 398.25984 401.02983 403.7998 408.7998 411.2998 416.2998 419.61979 422.11979 426.54978 429.04978 431.81977 436.81977 441.81977 446.24977 448.74977 453.74977 456.24977 460.67976 464.00975 467.33973 472.33973 475.6597 478.1597 480.6597 483.1597 488.7197 493.7197 496.2197 498.7197 501.4897 506.4897 510.91969 514.2397 518.6697">it is reported to be today.  Remember that the P-Value is the probability of a type 1 error.  So, there </tspan></text>
<text xml:space="preserve" transform="matrix(1 0 -0 1 -221.34986 727.1998)" font-size="10" font-family="'Liberation Serif','Times New Roman',Tinos,Times,serif"><tspan y="-637" x="122.5 125.27 129.16 131.66 136.09 138.59 143.59 146.09 148.86 153.86 156.36 161.36 166.36 168.86 173.86 178.86 183.86 186.36 190.79001 195.79001 200.22 205.22 209.65 214.07999 216.57999 219.34999 224.34999 228.78 231.55 234.05 241.27 245.70001 248.20001 252.63 255.96 260.39 262.89 266.22 270.65 273.41999 277.84999 282.27998 285.04997 287.81996 292.81996 297.81996 300.31996 303.08995 308.08995 312.51994 315.01994 320.01994 325.01994 327.78993 330.5599 333.0599 338.0599 343.0599 348.0599 353.0599 355.8299 360.8299 365.2599 369.1499 371.9199 375.8099 378.3099 380.8099 385.2399 390.2399 394.6699 399.6699 402.1699 404.93989 409.93989 414.93989 419.93989 424.93989 429.93989 432.43989 435.20988 437.97987 440.47987 443.24986 447.13987 449.63987 452.40986 455.73985 460.73985 465.16984 467.66984 470.16984 472.66984 478.22984 483.22984 486.5598 489.0598 491.8298 496.8298 501.2598 504.0298">is a 6 in 10,000 chance that we are rejecting the null hypothesis, even though it is true.  For that </tspan></text>
