<text xml:space="preserve" transform="matrix(1 0 -0 1 -221.34986 727.1998)" font-size="10" font-family="'Liberation Serif','Times New Roman',Tinos,Times,serif"><tspan y="-660.1" x="122.5 129.72 134.72 139.72 142.49 147.49 149.99 154.99 159.42002 163.85 168.85 172.18001 174.68001 177.45001 182.45001 184.95001 189.38 191.88 195.77 200.20001 207.97002 212.97002 215.74002 220.17002 222.67002 227.67002 230.99002 233.49002 238.49002 243.49002 248.49002 250.99002 253.76003 258.76 263.76 266.53 271.53 274.3 279.3 284.3 288.72999 291.49998 295.38999 297.88999 300.65998 303.98997 306.48997 309.25996 314.25996 318.68995 321.18995 324.50993 328.9399 331.7099 336.1399 338.6399 343.6399 346.96989 349.46989 354.46989 358.89988 363.32987 367.75987 370.52986 375.52986 379.95985 382.72984 385.49983 390.49983 395.49983 397.99983 400.7698 405.7698 408.2698 415.4898 419.9198 424.3498 428.7798 436.54978 441.54978 445.97978 449.30976 451.80976 456.80976 461.80976 466.80976 471.80976 474.30976 481.52976 485.95976 489.84977 492.34977 497.34977 502.34977 510.67976 513.17977 515.67977 520.10977">would occur in a sample of 148 individuals if the rate of vaccination in December 2021 was 78%, as</tspan></text>
